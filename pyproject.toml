[project]
name = "ep133-mcp"
version = "0.1.0.dev0"
description = "MCP server that installs samples onto a Teenage Engineering EP-133 K.O. II"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "mcp>=2,<3",
    "mido>=1.3",
    "python-rtmidi>=1.5",
]

[project.scripts]
ep133-mcp = "ep133_mcp.server:main"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]
# Reference-song pipeline (fetch/analyze/extract). ffmpeg is a system dependency.
audio = ["yt-dlp>=2025.1", "librosa>=0.10", "soundfile>=0.12", "numpy>=1.26", "demucs>=4.0", "beat_this>=1.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ep133_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.uv]
# A universal lock otherwise settles on torch 2.2.2 (the last Intel-macOS wheel),
# which has no CPython 3.13 build. Intel macOS is not a supported target.
environments = [
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
    "sys_platform == 'linux'",
    "sys_platform == 'win32'",
]
