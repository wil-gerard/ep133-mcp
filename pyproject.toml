[project]
name = "ep133-mcp"
version = "0.1.0.dev0"
description = "MCP server that installs samples onto a Teenage Engineering EP-133 K.O. II"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "mcp>=2,<3",
    "mido>=1.3",
    "python-rtmidi>=1.5",
]

[project.scripts]
ep133-mcp = "ep133_mcp.server:main"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ep133_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
